name: Quant strats research validation
on:
  push:
    paths: ['strats/**', '.github/workflows/strats.yml']
  pull_request:
    paths: ['strats/**', '.github/workflows/strats.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: strats/requirements.txt
      - run: python -m pip install -r strats/requirements.txt
      - run: python -m strats.ingest
      - run: python -m strats.options_pricing
      - run: python -m strats.treasury_risk
      - run: python -m unittest discover -s strats/tests -v
